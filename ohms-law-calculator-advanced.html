<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ohm's Law Calculator | Calcora</title><meta name="description" content="Calculate voltage, current or resistance using Ohm's law."><link rel="canonical" href="https://azeemwaseem2020.github.io/ohms-law-calculator-advanced.html"><meta name="robots" content="index,follow"><link rel="stylesheet" href="styles.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Ohm's Law Calculator","applicationCategory":"UtilitiesApplication","operatingSystem":"Web","description":"Calculate voltage, current or resistance using Ohm's law."}</script></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="./">Calcora</a><nav><a href="calculators.html">All Calculators</a></nav></div></header><main>
<div class="calculator-box"><p>Enter any two values. Leave the other fields empty and Calcora will solve the missing quantity.</p>
<label>Voltage V (V)<input id="v" type="number" step="any"></label><label>Current I (A)<input id="i" type="number" step="any"></label><label>Resistance R (Ω)<input id="res" type="number" step="any"></label>
<button type="button" onclick="calc()">Solve</button><div id="r" class="result" aria-live="polite"></div></div>
<h2>Formula</h2><p>Ohm's law is V = I × R. From it, I = V/R and R = V/I.</p><h2>FAQ</h2><p><strong>How many values should I enter?</strong> Enter exactly two positive values; the calculator solves the third.</p>
<script>function calc(){const a=v.value.trim(),b=i.value.trim(),c=res.value.trim(),n=[a,b,c].filter(x=>x!=='').length;if(n!==2){r.textContent='Enter exactly two values.';return}let V=a===''?null:+a,I=b===''?null:+b,R=c===''?null:+c;if([V,I,R].some(x=>x!==null&&(!Number.isFinite(x)||x<=0))){r.textContent='Use positive numeric values.';return}if(V===null)V=I*R;if(I===null)I=V/R;if(R===null)R=V/I;r.textContent='V = '+V.toFixed(6)+' V | I = '+I.toFixed(6)+' A | R = '+R.toFixed(6)+' Ω'}</script></main><script>const q=s=>document.querySelector(s),o=q('#result');function bad(){o.textContent='Please enter valid values.'}function show(x){o.innerHTML=x}q('#f').addEventListener('submit',e=>{e.preventDefault();let v=+q('#v').value,i=+q('#i').value,r=+q('#r').value;if(!isFinite(v)||!isFinite(i)||!isFinite(r))return bad();show('V = '+(i*r).toFixed(4)+'<br>I = '+(r? (v/r).toFixed(4):'—')+'<br>R = '+(i?(v/i).toFixed(4):'—'));});</script></body></html>
