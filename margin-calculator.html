<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Margin Calculator | Calcora</title><meta name="description" content="Calculate gross margin, markup and profit from cost and selling price."><meta name="robots" content="index,follow"><link rel="canonical" href="https://azeemwaseem2020.github.io/margin-calculator.html"><link rel="stylesheet" href="styles.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Margin Calculator","url":"https://azeemwaseem2020.github.io/margin-calculator.html","applicationCategory":"FinanceApplication","operatingSystem":"Any","isAccessibleForFree":true,"offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="./"><span class="brand-mark">C</span>Calcora</a><nav aria-label="Primary navigation"><a href="calculators.html">Calculators</a></nav></div></header><main class="section prose"><p class="eyebrow">CALCORA</p><h1>Margin Calculator</h1><p class="lead">Calculate gross margin, markup and profit from cost and selling price.</p><section class="card" style="max-width:720px"><label>Cost<input id="c" type="number" value="60" min="0" step=".01"></label><label>Selling price<input id="s" type="number" value="100" min="0" step=".01"></label><button class="btn" id="go">Calculate Margin</button><div id="o" class="callout" aria-live="polite"></div></section><p>Margin is profit divided by selling price. Markup is profit divided by cost; they are different percentages.</p><h2>Related calculators</h2><p><a href="roi-calculator.html">ROI</a> · <a href="commission-calculator.html">Commission</a> · <a href="percentage-calculator.html">Percentage</a></p></main><script>go.onclick=()=>{let c=+document.getElementById('c').value,s=+document.getElementById('s').value,o=document.getElementById('o');if(!(c>=0&&s>0)){o.textContent='Enter a non-negative cost and positive selling price.';return}let p=s-c;o.innerHTML='<strong>Profit:</strong> '+p.toFixed(2)+'<br><strong>Gross margin:</strong> '+(p/s*100).toFixed(2)+'%<br><strong>Markup:</strong> '+(c? p/c*100:0).toFixed(2)+'%';}</script></body></html>
