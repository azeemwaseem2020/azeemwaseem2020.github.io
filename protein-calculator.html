<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Protein Calculator | Calcora</title><meta name="description" content="Estimate a daily protein target from body weight and an editable protein-per-kilogram target."><meta name="robots" content="index,follow"><link rel="canonical" href="https://azeemwaseem2020.github.io/protein-calculator.html"><link rel="stylesheet" href="styles.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Protein Calculator","url":"https://azeemwaseem2020.github.io/protein-calculator.html","applicationCategory":"HealthApplication","operatingSystem":"Any","isAccessibleForFree":true,"offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="./"><span class="brand-mark">C</span>Calcora</a><nav><a href="calculators.html">Calculators</a></nav></div></header><main class="section prose"><p class="eyebrow">CALCORA</p><h1>Protein Calculator</h1><p class="lead">Estimate a daily protein target from body weight and an editable protein-per-kilogram target.</p><section class="card" style="max-width:700px"><label>Body weight (kg)<input id="w" type="number" value="70" min="1" step=".1"></label><label>Protein target (g/kg)<input id="r" type="number" value="1.2" min=".1" step=".1"></label><button class="btn" id="go">Calculate Protein</button><div id="o" class="callout" aria-live="polite"></div></section><p>This is a general nutrition estimate. Individual needs vary with age, activity, goals and medical conditions.</p><h2>Related calculators</h2><p><a href="calorie-calculator.html">Calorie</a> · <a href="tdee-calculator.html">TDEE</a> · <a href="bmi-calculator.html">BMI</a></p></main><script>go.onclick=()=>{let w=+document.getElementById('w').value,r=+document.getElementById('r').value,o=document.getElementById('o');if(!(w>0&&r>0)){o.textContent='Enter valid values.';return}o.innerHTML='<strong>Estimated daily protein:</strong> '+(w*r).toFixed(0)+' g';}</script></body></html>
