<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Number Generator | Calcora</title><meta name="description" content="Generate a random integer between a minimum and maximum value using your browser."><meta name="robots" content="index,follow"><link rel="canonical" href="https://azeemwaseem2020.github.io/random-number-generator.html"><link rel="stylesheet" href="styles.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Random Number Generator","url":"https://azeemwaseem2020.github.io/random-number-generator.html","applicationCategory":"UtilitiesApplication","operatingSystem":"Any","isAccessibleForFree":true,"offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="./"><span class="brand-mark">C</span>Calcora</a><nav aria-label="Primary navigation"><a href="calculators.html">Calculators</a></nav></div></header><main class="section prose"><p class="eyebrow">CALCORA</p><h1>Random Number Generator</h1><p class="lead">Generate a random integer between a minimum and maximum value using your browser.</p><section class="card" style="max-width:620px"><label>Minimum<input id="a" type="number" value="1"></label><label>Maximum<input id="b" type="number" value="100"></label><label>How many numbers<input id="n" type="number" value="1" min="1" max="100"></label><button class="btn" id="go">Generate</button><div id="o" class="callout" aria-live="polite"></div></section><h2>Related calculators</h2><p><a href="calculators.html">All Calculators</a> · <a href="statistics-calculator.html">Statistics</a> · <a href="mean-median-mode-calculator.html">Mean Median Mode</a></p></main><script>go.onclick=()=>{let a=Math.ceil(+a1.value),b=Math.floor(+b1.value),n=Math.min(100,Math.max(1,+n1.value)),o=document.getElementById('o');if(!(a<=b)){o.textContent='Minimum must be less than or equal to maximum.';return}let arr=[];for(let i=0;i<n;i++)arr.push(Math.floor(Math.random()*(b-a+1))+a);o.innerHTML='<strong>Random result:</strong> '+arr.join(', ');};var a1=document.getElementById('a'),b1=document.getElementById('b'),n1=document.getElementById('n');</script></body></html>
