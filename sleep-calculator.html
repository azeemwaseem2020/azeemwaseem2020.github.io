<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sleep Calculator | Calcora</title><meta name="description" content="Plan approximate sleep and wake times using sleep cycles."><link rel="canonical" href="https://azeemwaseem2020.github.io/sleep-calculator.html"><meta name="robots" content="index,follow"><link rel="stylesheet" href="styles.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Sleep Calculator","applicationCategory":"UtilitiesApplication","operatingSystem":"Web","description":"Plan approximate sleep and wake times using sleep cycles."}</script></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="./">Calcora</a><nav><a href="calculators.html">All Calculators</a></nav></div></header><main>
<section class="calculator-box"><label>Wake-up time<input id="wake" type="time"></label><button type="button" onclick="calc()">Suggest bedtimes</button><div id="r" class="result" aria-live="polite"></div></section><h2>How it works</h2><p>This planning tool counts backward in approximate 90-minute sleep-cycle intervals and adds about 15 minutes for falling asleep. Individual sleep needs vary.</p><h2>FAQ</h2><p><strong>Is this medical advice?</strong> No. It is only a time-planning aid.</p><script>function calc(){if(!wake.value){r.textContent='Choose a wake-up time.';return}const [h,m]=wake.value.split(':').map(Number),d=new Date(2000,0,2,h,m),o=[6,5].map(c=>{const x=new Date(d-(c*90+15)*60000);return c+' cycles: '+x.toTimeString().slice(0,5)});r.textContent=o.join(' | ')}</script></main><script>const q=s=>document.querySelector(s),o=q('#result');function bad(){o.textContent='Please enter valid values.'}function show(x){o.innerHTML=x}q('#f').addEventListener('submit',e=>{e.preventDefault();let c=+q('#cycles').value;if(!isFinite(c)||c<1)return bad();show((c*90/60).toFixed(2)+' hours of cycle time');});</script></body></html>
