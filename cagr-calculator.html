f="blog.html">Guides</a><a href="about.html">About</a></nav></div></header><main class="section prose"><p class="eyebrow">FINANCE CALCULATOR</p><h1>CAGR Calculator</h1><p class="lead">Calculate compound annual growth rate from starting value, ending value and number of years.</p><section class="card" style="max-width:760px"><h2>Compound annual growth rate</h2><label>Starting value<input id=s type=number value=10000 min=0></label><label>Ending value<input id=e type=number value=18000 min=0></label><label>Years<input id=y type=number value=5 min=.01imates based on the inputs and standard formulas shown or described on this page. Real-world rates, taxes, fees and eligibility rules can vary by country and provider.</p><section id="calcora-faq"><h2>Frequently asked questions</h2><details><summary>What is CAGR?</summary><p>CAGR, or compound annual growth rate, is the constant annual rate that would turn an initial value into a final value over a specified period.</p></details><details><summary>What does CAGR not show?</summary><p>CAGR smooths growth into one annualized rate and does not show year-to-year volatility or the path taken between the starting and ending values.</p></details><details><summary>Where is CAGR useful?</summary><p>It is commonly used to compare the annualized growth of investments, revenue, sales or other values across a multi-year period.</p></details></section><p><a href="calculators.html">Browse all Calcora calculators</a> · <a href="./">Calcora home</a></p><section class="calcora-quick-guide" id="calcora-quick-guide"><h2>Quick guide: how to use this calculator</h2><p>Enter the starting value, ending value and number of years to estimate the compound annual growth rate.</p><h3>Formula or method</h3><p><strong>CAGR = (Ending value / Starting value)^(1/n) − 1.</strong></p><h3>Useful note</h3><p>CAGR describes a smoothed annual growth rate; it does not show the ups and downs that occurred between the starting and ending dates.</p><h3>Before you use the result</h3><p>The answer depends on the values, units and assumptions entered. Check the method shown on this page before comparing the result with another calculator or source.</p></section>
<section class="prose calcora-content-expansion"><h2>How CAGR is calculated</h2><p>Compound annual growth rate estimates the constant annual rate that would turn a beginning value into an ending value over a stated number of periods. The formula is CAGR = (Ending Value ÷ Beginning Value)^(1/n) − 1.</p><h3>Worked example</h3><p>If an investment grows from 10,000 to 16,000 over 4 years, CAGR is (16,000 ÷ 10,000)^(1/4) − 1, or about 12.47% per year.</p><h3>CAGR is not a year-by-year return</h3><p>CAGR smooths the start and end values into one annualized rate. It does not show volatility or the actual path taken between those dates.</p><h2>CAGR FAQ</h2><h3>Can CAGR be negative?</h3><p>Yes. If the ending value is lower than the beginning value over a positive period, the calculated CAGR is negative.</p><h3>Does CAGR include deposits or withdrawals?</h3><p>The basic CAGR formula assumes only a beginning value and ending value. Cash flows during the period require a different return calculation.</p><h2>CAGR formula and example</h2><p><strong>CAGR = (Ending value ÷ Starting value)<sup>1/n</sup> − 1</strong>, where n is the number of years or periods.</p><h2>Worked example</h2><p>If a value rises from 10,000 to 16,000 over 4 years, CAGR = (16,000 ÷ 10,000)<sup>1/4</sup> − 1 ≈ <strong>12.47% per year</strong>.</p><h2>What CAGR does not show</h2><p>CAGR smooths the beginning and ending values into one annualized rate. It does not show annual volatility or the actual path between the two dates. Cash flows during the period require a different return method.</p><h2>FAQ</h2><h3>Can CAGR be negative?</h3><p>Yes. If the ending value is below the starting value over a positive period, CAGR is negative.</p><h3>Is CAGR the same as average annual return?</h3><p>No. CAGR is a compounded annualized rate between two endpoints, while an arithmetic average of yearly returns can produce a different result.</p></section>
<section class="prose" id="calcora-semantic-context"><h2>Calculation context</h2><p>Compound annual growth rate summarizes the constant annualized growth rate that would connect an initial value to an ending value over a defined period. It describes a smoothed rate and does not imply that growth actually occurred evenly each year.</p><p><a href="finance-calculator-hub.html">Financial Calculators</a> · <a href="calculators.html">All Calculators</a></p></section></main>
