<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pregnancy Week Calculator | Calcora</title><meta name="description" content="Estimate pregnancy week from the last menstrual period date."><link rel="canonical" href="https://azeemwaseem2020.github.io/pregnancy-week-calculator.html"><meta name="robots" content="index,follow"><link rel="stylesheet" href="styles.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Pregnancy Week Calculator","applicationCategory":"UtilitiesApplication","operatingSystem":"Web","description":"Estimate pregnancy week from the last menstrual period date."}</script></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="./">Calcora</a><nav><a href="calculators.html">All Calculators</a></nav></div></header><main>
<section class="calculator-box"><label>First day of last menstrual period<input id="lmp" type="date"></label><button type="button" onclick="calc()">Calculate</button><div id="r" class="result" aria-live="polite"></div></section><h2>How it works</h2><p>Gestational age is commonly counted from the first day of the last menstrual period. Clinical dating may differ.</p><h2>FAQ</h2><p><strong>Is this a diagnosis?</strong> No. Use professional prenatal care for medical decisions.</p><script>function calc(){const x=new Date(lmp.value+'T00:00:00'),now=new Date();if(!lmp.value||isNaN(x)){r.textContent='Choose a valid date.';return}const today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),days=Math.floor((today-x)/86400000);if(days<0){r.textContent='Date cannot be in the future.';return}r.textContent='Estimated gestational age: '+Math.floor(days/7)+' weeks '+days%7+' days'}</script></main><script>const q=s=>document.querySelector(s),o=q('#result');function bad(){o.textContent='Please enter valid values.'}function show(x){o.innerHTML=x}q('#f').addEventListener('submit',e=>{e.preventDefault();let d=+q('#days').value;if(!isFinite(d)||d<0)return bad();show(Math.floor(d/7)+' weeks '+(d%7)+' days');});</script></body></html>
