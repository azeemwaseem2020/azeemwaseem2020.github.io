<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tile Calculator | Calcora</title><meta name="description" content="Estimate tile count from floor area and tile dimensions."><link rel="canonical" href="https://azeemwaseem2020.github.io/tile-calculator.html"><meta name="robots" content="index,follow"><link rel="stylesheet" href="styles.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Tile Calculator","applicationCategory":"UtilitiesApplication","operatingSystem":"Web","description":"Estimate tile count from floor area and tile dimensions."}</script></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="./">Calcora</a><nav><a href="calculators.html">All Calculators</a></nav></div></header><main><h1>Tile Calculator</h1>
<section class="calculator-box"><label>Room length<input id="l" type="number" min="0" step="any"></label><label>Room width<input id="w" type="number" min="0" step="any"></label><label>Tile length<input id="tl" type="number" min="0" step="any"></label><label>Tile width<input id="tw" type="number" min="0" step="any"></label><label>Waste %<input id="wa" type="number" min="0" step="any" value="10"></label><button type="button" onclick="calc()">Calculate tiles</button><div id="r" class="result" aria-live="polite"></div></section><h2>How it works</h2><p>Use the same unit for all dimensions. Tile count = room area ÷ tile area, increased by waste and rounded up.</p><h2>FAQ</h2><p><strong>Why include waste?</strong> Cutting, breakage and layout can require additional tiles.</p><script>function calc(){const A=+l.value*+w.value,T=+tl.value*+tw.value,W=+wa.value;if(![A,T,W].every(Number.isFinite)||A<=0||T<=0||W<0){r.textContent='Enter valid dimensions and waste.';return}r.textContent='Estimated tiles needed = '+Math.ceil(A/T*(1+W/100))}</script></main><script>const q=s=>document.querySelector(s),o=q('#result');function bad(){o.textContent='Please enter valid values.'}function show(x){o.innerHTML=x}q('#f').addEventListener('submit',e=>{e.preventDefault();let a=+q('#area').value,t=+q('#tile').value;if(!isFinite(a)||!isFinite(t)||t<=0)return bad();show(Math.ceil(a/t)+' tiles');});</script></body></html>
