tById('x').value,o=document.getElementById('o');if(!(r>=0&&h>=0&&x>=0)){o.textContent='Enter valid values.';return}o.innerHTML='<strong>Regular pay:</strong> '+(r*h).toFixed(2)+'<br><strong>Overtime rate:</strong> '+(r*1.5).toFixed(2)+'<br><strong>Overtime pay:</strong> '+(r*1.5*x).toFixed(2)+'<br><strong>Total:</strong> '+(r*h+r*1.5*x).toFixed(2);}</script></body></html>
