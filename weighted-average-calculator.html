<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weighted Average Calculator | Calcora</title><meta name="description" content="Calculate a weighted average from values and weights."><link rel="canonical" href="https://azeemwaseem2020.github.io/weighted-average-calculator.html"><meta name="robots" content="index,follow"><link rel="stylesheet" href="styles.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Weighted Average Calculator","applicationCategory":"UtilitiesApplication","operatingSystem":"Web","description":"Calculate a weighted average from values and weights."}</script></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="./">Calcora</a><nav><a href="calculators.html">All Calculators</a></nav></div></header><main>
<div class="calculator-box">
<label>Value 1<input id="v1" type="number" step="any"></label><label>Weight 1<input id="w1" type="number" min="0" step="any"></label>
<label>Value 2<input id="v2" type="number" step="any"></label><label>Weight 2<input id="w2" type="number" min="0" step="any"></label>
<button type="button" onclick="calc()">Calculate weighted average</button><div id="r" class="result" aria-live="polite"></div></div>
<h2>How it works</h2><p>The weighted average is (value₁ × weight₁ + value₂ × weight₂) ÷ (weight₁ + weight₂). Larger weights give an input more influence.</p>
<h2>FAQ</h2><p><strong>Can a weight be zero?</strong> Yes, but the total weight must be greater than zero.</p>
<script>function calc(){const a=+v1.value,b=+w1.value,c=+v2.value,d=+w2.value;if([a,b,c,d].some(x=>!Number.isFinite(x))||b<0||d<0||b+d===0){r.textContent='Enter valid values and weights; total weight must be greater than zero.';return}r.textContent='Weighted average = '+((a*b+c*d)/(b+d)).toFixed(6)}</script></main><script>const q=s=>document.querySelector(s),o=q('#result');function bad(){o.textContent='Please enter valid values.'}function show(x){o.innerHTML=x}q('#f').addEventListener('submit',e=>{e.preventDefault();let a=+q('#a').value,b=+q('#b').value,w=+q('#w').value;if(!isFinite(a)||!isFinite(b)||!isFinite(w)||w===0)return bad();show(((a+b*w)/(1+w)).toFixed(6));});</script></body></html>
