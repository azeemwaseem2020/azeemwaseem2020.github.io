name: Fertilizer tools QA

on:
  push:
    paths:
      - 'fertilizer-application-variance-checker.html'
      - 'fertilizer-split-application-planner.html'
      - 'fertilizer-calculator.html'
      - 'fertilizer-blend-calculator.html'
      - 'fertilizer-bag-calculator.html'
      - 'agriculture-fertilizer-hub.html'
      - '*-fertilizer-calculator-pakistan.html'
      - 'sitemap.xml'
      - 'sitemap-pakistan-priority.xml'
      - 'scripts/validate-fertilizer-tools.mjs'
      - '.github/workflows/fertilizer-tool-qa.yml'
  pull_request:
    paths:
      - 'fertilizer-application-variance-checker.html'
      - 'fertilizer-split-application-planner.html'
      - 'fertilizer-calculator.html'
      - 'fertilizer-blend-calculator.html'
      - 'fertilizer-bag-calculator.html'
      - 'agriculture-fertilizer-hub.html'
      - '*-fertilizer-calculator-pakistan.html'
      - 'sitemap.xml'
      - 'sitemap-pakistan-priority.xml'
      - 'scripts/validate-fertilizer-tools.mjs'
      - '.github/workflows/fertilizer-tool-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fertilizer-qa:
    name: Validate fertilizer tools, metadata and calculations
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run fertilizer QA checks
        run: node scripts/validate-fertilizer-tools.mjs
