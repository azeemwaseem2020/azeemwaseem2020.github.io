name: Generate social preview image
on:
  push:
    branches: [main]
    paths:
      - og-image.svg
      - .github/workflows/generate-og-image.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Render 1200x630 PNG
        run: rsvg-convert -w 1200 -h 630 -o og-image.png og-image.svg
      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-image.png
          git diff --cached --quiet && exit 0
          git commit -m "Generate 1200x630 PNG social preview image"
          git push
