name: Calculator regression tests

on:
  push:
    paths:
      - "tests/**"
      - "*.html"
      - "calculator-search.js"
      - "navigation.js"
      - "sitemap.xml"
      - ".github/workflows/calculator-tests.yml"
  pull_request:
    paths:
      - "tests/**"
      - "*.html"
      - "calculator-search.js"
      - "navigation.js"
      - "sitemap.xml"
      - ".github/workflows/calculator-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check calculator search JavaScript syntax
        run: node --check calculator-search.js
      - name: Run regression tests
        run: |
          node tests/psx-calculator-core.test.js
          node tests/psx-seo-integrity.test.js
          node tests/science-calculators.test.js
          node tests/sitemap-integrity.test.js
          node tests/search-integrity.test.js
